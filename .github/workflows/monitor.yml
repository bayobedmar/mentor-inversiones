name: Mentor Inversiones Monitor

on:
  schedule:
    - cron: '0 8,12,16,19 * * 1-5'
  workflow_dispatch:

jobs:
  analizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install yfinance pandas numpy
      - name: Ejecutar monitor
        env:
          EMAIL_ORIGEN: ${{ secrets.EMAIL_ORIGEN }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python mentor_alertas.py
